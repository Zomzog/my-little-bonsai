<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- interactive-widget=resizes-content makes the virtual keyboard shrink the
         layout viewport, so Compose re-measures and scrolls the focused field into
         view the way the Android app does, instead of the browser panning a canvas
         that cannot reflow. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>My Little Bonsai</title>
    <style>
        :root { color-scheme: light dark; }

        /* Compose measures <body> and sizes its canvas to it, so <body> is held
           at exactly the viewport size. The canvas cannot reflow, so the page
           must never scroll or zoom either: any overflow makes mobile Chrome
           rescale the whole document. */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: #FFFBFE;
            color: #1C1B1F;
            font-family: system-ui, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            html, body { background: #1C1B1F; color: #E6E1E5; }
        }

        /* Replaced by the Compose canvas once the app mounts — if it is still
           on screen, start-up failed. */
        #bootstrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0 24px;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>
<body>
<div id="bootstrap">Loading…</div>
<script>
    (function () {
        // Compose only re-measures its container on window "resize". Mobile
        // browsers settle the viewport after the app has booted (URL bar
        // collapsing, rotation, virtual keyboard), which would otherwise leave
        // the canvas at a stale size.
        function remeasure() {
            window.dispatchEvent(new Event('resize'));
        }

        window.addEventListener('load', remeasure);
        window.addEventListener('orientationchange', remeasure);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', remeasure);
        }

        // A failed start-up leaves an empty page, which is indistinguishable
        // from a rendering bug. Surface the error instead.
        window.addEventListener('error', function (event) {
            var bootstrap = document.getElementById('bootstrap');
            if (bootstrap) {
                bootstrap.textContent = 'Failed to start: ' + (event.message || 'unknown error');
            }
        });
    })();
</script>
<script src="composeApp.js"></script>
</body>
</html>
